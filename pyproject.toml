[project]
name = "ordercapture_ocr"
authors = [
    { name = "AkhilamInc", email = "raaj@akhilaminc.com"}
]
description = "OCR Tool to convert pdf,xls,csv to erpnext sales orders"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
    "openai",
    "pdfplumber",
    "pdfminer-six",  # Direct dependency to track security updates
    # Security Note: pdfminer-six has vulnerability GHSA-f83h-ghpp-7wcc
    # (unsafe pickle deserialization in CMap loading). Code includes
    # security wrapper to mitigate risk. Monitor for updates.
    "pandas",
    "openpyxl>=3.1.0",
    "google-genai",
    "PyPDF2"
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "W",    # pycodestyle warnings
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "RUF",  # ruff-specific rules
]
ignore = [
    "B017", "B018", "B023", "B904",
    "E101", "E402", "E501", "E741",
    "F401", "F403", "F405", "F722",
    "W191",
    "SIM108",
    "UP007",
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["E402", "F401"]
"patches/*.py" = ["B007", "F841"]

[tool.ruff.lint.isort]
known-first-party = ["frappe", "erpnext"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
line-ending = "lf"
docstring-code-format = true
